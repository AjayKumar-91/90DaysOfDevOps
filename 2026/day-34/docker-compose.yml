services:
  database:
    image: mysql:8.0
    container_name: test-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: mysql
      MYSQL_PASSWORD: Test@123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - test-net
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flask:
    build: ./app
    container_name: flask-app
    environment:
      DB_HOST: database
      DB_USER: mysql
      DB_PASSWORD: Test@123
      DB_NAME: mydb
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - test-net
    restart: always

  redis:
    image: redis:latest
    networks:
      - test-net
    restart: always

networks:
  test-net:

volumes:
  mysql-data: