apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-pod
  namespace: default
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "date > /data/message.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}
