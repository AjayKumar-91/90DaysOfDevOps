kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment 
  labels:
    app: nginx-label
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-label
  template:
    metadata:
      labels:
        app: nginx-label
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.14.2
        ports:
        - containerPort: 80